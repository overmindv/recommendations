name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: activity_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make lint
      - run: make test
      - run: make build
      - run: make benchmark
      - run: go run ./cmd/recommendations migrate --dir migrations --dsn "$STUDY_ACTIVITY_TEST_DSN" up && make activity-ctest
        env:
          STUDY_ACTIVITY_TEST_DSN: postgres://postgres:postgres@localhost:5432/activity_test?sslmode=disable
      - run: go test -race -count=1 ./internal/replay
        env:
          REPLAY_TEST_DSN: postgres://postgres:postgres@localhost:5432/activity_test?sslmode=disable
      - run: go test -race -count=1 ./internal/studyplans
        env:
          STUDY_PLANS_TEST_DSN: postgres://postgres:postgres@localhost:5432/activity_test?sslmode=disable
      - run: make evidence-ctest
        env:
          LEARNING_EVIDENCE_TEST_DSN: postgres://postgres:postgres@localhost:5432/activity_test?sslmode=disable
