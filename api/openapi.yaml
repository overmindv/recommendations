openapi: 3.1.0
info:
  title: Recommendations learner onboarding
  version: 1.0.0
servers:
  - url: http://recommendations:8080
security:
  - gatewayToken: []
paths:
  /v1/learner/goal-templates:
    parameters:
      - $ref: '#/components/parameters/Actor'
    get:
      operationId: listGoalTemplates
      responses:
        '200':
          description: Versioned templates. Topics are selected from the catalog, not inferred from the template.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GoalTemplate'
        default:
          $ref: '#/components/responses/Error'
  /v1/learner/profile:
    parameters:
      - $ref: '#/components/parameters/Actor'
    get:
      operationId: getLearnerProfile
      responses:
        '200':
          $ref: '#/components/responses/Profile'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: saveLearnerProfile
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ProfileVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityInput'
      responses:
        '200':
          $ref: '#/components/responses/Profile'
        default:
          $ref: '#/components/responses/Error'
  /v1/learner/goals:
    parameters:
      - $ref: '#/components/parameters/Actor'
    get:
      operationId: listLearnerGoals
      responses:
        '200':
          description: The learner's goals, including inactive goals, newest update first.
          content:
            application/json:
              schema:
                type: array
                maxItems: 32
                items:
                  $ref: '#/components/schemas/Goal'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createLearnerGoal
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/Goal'
      responses:
        '201':
          $ref: '#/components/responses/Goal'
        default:
          $ref: '#/components/responses/Error'
  /v1/learner/goals/{id}:
    parameters:
      - $ref: '#/components/parameters/Actor'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getLearnerGoal
      responses:
        '200':
          $ref: '#/components/responses/Goal'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateLearnerGoal
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/GoalVersion'
      requestBody:
        $ref: '#/components/requestBodies/Goal'
      responses:
        '200':
          $ref: '#/components/responses/Goal'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteLearnerGoal
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/GoalVersion'
      responses:
        '204':
          description: Deleted. Repeating the same successful deletion with the same key also returns 204.
        default:
          $ref: '#/components/responses/Error'
  /v1/learner/goals/{id}/mastery:
    parameters:
      - $ref: '#/components/parameters/Actor'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getMasteryBaseline
      responses:
        '200':
          $ref: '#/components/responses/Mastery'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: refreshMasteryBaseline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [goal_version]
              properties:
                goal_version:
                  type: integer
                  format: int64
                  minimum: 1
      responses:
        '200':
          $ref: '#/components/responses/Mastery'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/learner/goals/{id}/retention:
    parameters:
      - $ref: '#/components/parameters/Actor'
      - $ref: '#/components/parameters/RetentionGoal'
    get:
      operationId: getRetentionPlan
      responses:
        '200':
          description: Current review status of the learner's target topics.
          content:
            application/json:
              schema:
                type: object
                required: [goal_version, truncated, topics]
                properties:
                  goal_version:
                    type: integer
                    format: int64
                    minimum: 1
                  truncated:
                    type: boolean
                  topics:
                    type: array
                    minItems: 1
                    maxItems: 16
                    items:
                      $ref: '#/components/schemas/TopicReview'
        default:
          $ref: '#/components/responses/Error'
  /v1/learner/goals/{id}/retention/{topic}:
    parameters:
      - $ref: '#/components/parameters/Actor'
      - $ref: '#/components/parameters/RetentionGoal'
      - name: topic
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: assignRetentionCheck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [goal_version, due_at]
              properties:
                goal_version:
                  type: integer
                  format: int64
                  minimum: 1
                due_at:
                  type: string
                  format: date-time
      responses:
        '200':
          description: The assigned check, its result on replay, or no new task in the candidate window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicReview'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/learner/goals/{id}/study-plan:
    parameters:
      - $ref: '#/components/parameters/Actor'
      - $ref: '#/components/parameters/StudyPlanGoal'
    get:
      operationId: getCurrentStudyPlan
      responses:
        '200':
          $ref: '#/components/responses/StudyPlan'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: generateStudyPlan
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Goal-scoped request UUID. Replay returns the originally saved version.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [goal_version, availability_version, plan_version]
              properties:
                goal_version:
                  type: integer
                  format: int64
                  minimum: 1
                availability_version:
                  type: integer
                  format: int64
                  minimum: 1
                plan_version:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Current version, or zero if the goal has no plan.
      responses:
        '200':
          $ref: '#/components/responses/StudyPlan'
        default:
          $ref: '#/components/responses/Error'
  /v1/learner/goals/{id}/study-plan/steps/{ordinal}/activity:
    parameters:
      - $ref: '#/components/parameters/Actor'
      - $ref: '#/components/parameters/StudyPlanGoal'
      - $ref: '#/components/parameters/StudyStepOrdinal'
    put:
      operationId: completeStudyActivity
      requestBody:
        $ref: '#/components/requestBodies/StudyProgress'
      responses:
        '200':
          $ref: '#/components/responses/StudyPlan'
        default:
          $ref: '#/components/responses/Error'
  /v1/learner/goals/{id}/study-plan/steps/{ordinal}/assessment:
    parameters:
      - $ref: '#/components/parameters/Actor'
      - $ref: '#/components/parameters/StudyPlanGoal'
      - $ref: '#/components/parameters/StudyStepOrdinal'
    put:
      operationId: recordStudyAssessment
      requestBody:
        $ref: '#/components/requestBodies/StudyProgress'
      responses:
        '200':
          $ref: '#/components/responses/StudyPlan'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    gatewayToken:
      type: http
      scheme: bearer
      description: Internal gateway service token. Never sent to the browser.
  parameters:
    StudyPlanGoal:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StudyStepOrdinal:
      name: ordinal
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 128
    RetentionGoal:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Actor:
      name: X-User-ID
      in: header
      required: true
      description: Authenticated learner UUID set by the trusted gateway, never copied from the request body.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Learner-scoped UUID. Successful writes are replayable for 24 hours.
      schema:
        type: string
        format: uuid
    ProfileVersion:
      name: X-Expected-Version
      in: header
      required: true
      description: Version returned by GET, or zero to create a profile.
      schema:
        type: integer
        format: int64
        minimum: 0
    GoalVersion:
      name: X-Expected-Version
      in: header
      required: true
      description: Current goal version.
      schema:
        type: integer
        format: int64
        minimum: 1
  requestBodies:
    StudyProgress:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [plan_version]
            properties:
              plan_version:
                type: integer
                format: int64
                minimum: 1
    Goal:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GoalInput'
  responses:
    StudyPlan:
      description: The saved study plan, versioned inputs and current progress.
      headers:
        Cache-Control:
          schema:
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StudyPlan'
    Mastery:
      description: The current versioned mastery snapshot for the authenticated learner's goal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Mastery'
    Profile:
      description: Availability is null until the learner saves a weekly budget and time zone.
      content:
        application/json:
          schema:
            type: object
            required: [availability]
            properties:
              availability:
                oneOf:
                  - $ref: '#/components/schemas/Availability'
                  - type: 'null'
    Goal:
      description: Learner-owned goal. A write response reflects the saved revision, including on replay.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Goal'
    Error:
      description: >
        400 INVALID_ARGUMENT, 403 PERMISSION_DENIED, 404 NOT_FOUND, 409 PROFILE_REQUIRED,
        VERSION_CONFLICT, IDEMPOTENCY_CONFLICT, GOAL_LIMIT, STEP_BLOCKED, GRADE_PENDING or PLAN_LIMIT, 413 body too large,
        415 unsupported media type, 422 UNKNOWN_TOPIC, UNKNOWN_TEMPLATE or INFEASIBLE_GOAL,
        429 WRITE_LIMIT, or 503 SERVICE_UNAVAILABLE.
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code:
                type: string
              message:
                type: string
  schemas:
    StudyPlan:
      type: object
      required:
        - goal_id
        - version
        - goal_version
        - availability_version
        - target_topics
        - planner_version
        - ranking_algorithm
        - ranking_policy
        - evidence_watermark
        - evidence_policy
        - created_at
        - timezone
        - weekly_minutes
        - horizon_limited
        - weeks
        - unmet_outcomes
        - suggestions
        - current
        - stale
        - next_step
        - goal_demonstrated
      properties:
        goal_id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 1
        goal_version:
          type: integer
          format: int64
          minimum: 1
        availability_version:
          type: integer
          format: int64
          minimum: 1
        target_topics:
          type: array
          maxItems: 16
          items:
            type: string
            format: uuid
        planner_version:
          type: string
        ranking_algorithm:
          type: string
        ranking_policy:
          type: object
          required: [policy_version, weights]
        evidence_policy:
          type: object
          required: [revision, algorithm]
        evidence_watermark:
          type: string
          pattern: '^[0-9a-f]{64}$'
        created_at:
          type: string
          format: date-time
        timezone:
          type: string
        weekly_minutes:
          type: integer
          minimum: 0
          maximum: 10080
        horizon_limited:
          type: boolean
        weeks:
          type: array
          maxItems: 26
          items:
            $ref: '#/components/schemas/StudyWeek'
        unmet_outcomes:
          type: array
          items:
            type: object
        suggestions:
          type: array
          items:
            type: object
        current:
          type: boolean
        stale:
          type: boolean
        next_step:
          type: [integer, 'null']
          minimum: 1
          maximum: 128
        blocked_reason:
          enum: [stale_plan, check_failed, unverified_prerequisite]
        goal_demonstrated:
          type: boolean
    StudyWeek:
      type: object
      required: [from, through, capacity_minutes, planned_minutes, items]
      properties:
        from:
          type: string
          format: date
        through:
          type: string
          format: date
        capacity_minutes:
          type: integer
        planned_minutes:
          type: integer
        items:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/StudyStep'
    StudyStep:
      type: object
      required: [ordinal, kind, stage, resource_id, revision_id, topic_id, estimated_minutes, score, components]
      properties:
        ordinal:
          type: integer
          minimum: 1
          maximum: 128
        kind:
          enum: [theory, practice]
        stage:
          enum: [theory, practice, independent_check]
        resource_id:
          type: string
          format: uuid
        revision_id:
          type: string
          format: uuid
        topic_id:
          type: string
          format: uuid
        estimated_minutes:
          type: integer
          minimum: 1
        score:
          type: integer
          minimum: 0
        components:
          type: object
          required: [gap, difficulty, duration, variety, due_review]
        requires_checks:
          type: array
          maxItems: 64
          items:
            type: string
            format: uuid
        activity_completed_at:
          type: string
          format: date-time
        assessment:
          type: object
          required: [verdict, graded_at]
          properties:
            verdict:
              type: string
            graded_at:
              type: string
              format: date-time
    TopicReview:
      type: object
      required: [topic_id, status]
      properties:
        topic_id:
          type: string
          format: uuid
        status:
          enum: [unknown, current, due, assigned, expired, checked, no_new_task]
        due_at:
          type: string
          format: date-time
        check:
          $ref: '#/components/schemas/RetentionCheck'
    RetentionCheck:
      type: object
      required: [task_id, task_version_id, due_at, assigned_at, expires_at, estimated_minutes]
      properties:
        task_id:
          type: string
          format: uuid
        task_version_id:
          type: string
          format: uuid
        estimated_minutes:
          type: integer
          minimum: 1
          maximum: 20
        due_at:
          type: string
          format: date-time
        assigned_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        result:
          type: object
          required: [verdict, graded_at, weight_micros]
          properties:
            verdict:
              type: string
            graded_at:
              type: string
              format: date-time
            weight_micros:
              type: integer
              format: int64
              minimum: 1
              maximum: 1000000
    Mastery:
      type: object
      required: [goal_id, goal_version, policy, computed_at, truncated, topics]
      properties:
        goal_id:
          type: string
          format: uuid
        goal_version:
          type: integer
          format: int64
          minimum: 1
        policy:
          type: object
          required: [revision, algorithm, gap_max_bps, demonstrated_min_bps, min_weighted_tasks]
          properties:
            revision:
              type: string
              maxLength: 64
            algorithm:
              const: weighted-v1
            gap_max_bps:
              type: integer
              minimum: 0
              maximum: 9999
            demonstrated_min_bps:
              type: integer
              minimum: 1
              maximum: 10000
            min_weighted_tasks:
              type: integer
              minimum: 1
              maximum: 512
        computed_at:
          type: string
          format: date-time
        truncated:
          type: boolean
        topics:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/TopicMastery'
    TopicMastery:
      type: object
      required: [topic_id, score_bps, sample_count, weight_micros, last_evidence_at, state, uncertainty]
      properties:
        topic_id:
          type: string
          format: uuid
        score_bps:
          type: [integer, 'null']
          minimum: 0
          maximum: 10000
        sample_count:
          type: integer
          minimum: 0
          maximum: 512
        weight_micros:
          type: integer
          format: int64
          minimum: 0
          maximum: 512000000
        last_evidence_at:
          type: [string, 'null']
          format: date-time
        state:
          enum: [unknown, insufficient, gap, developing, demonstrated_in_sample]
        uncertainty:
          enum: [no_evidence, limited_sample, bounded_history, sufficient_for_policy]
    GoalTemplate:
      type: object
      required: [version, title, suggests_deadline]
      properties:
        version:
          type: string
          examples: ['exam:1']
        title:
          type: string
        suggests_deadline:
          type: boolean
    WeeklyMinutes:
      type: integer
      minimum: 0
      maximum: 10080
      default: 0
    AvailabilityInput:
      type: object
      required: [timezone]
      properties:
        weekly_minutes:
          $ref: '#/components/schemas/WeeklyMinutes'
        timezone:
          type: string
          maxLength: 64
          description: IANA time zone name, or UTC.
          examples: [Europe/Moscow]
    Availability:
      allOf:
        - $ref: '#/components/schemas/AvailabilityInput'
        - type: object
          required: [user_id, weekly_minutes, version, updated_at]
          properties:
            user_id:
              type: string
              format: uuid
            version:
              type: integer
              format: int64
            updated_at:
              type: string
              format: date-time
    GoalInput:
      type: object
      required: [title, target_topics]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
          description: Trimmed title, at most 256 UTF-8 bytes.
        template_version:
          type: string
          maxLength: 128
          description: Optional version returned by the templates endpoint.
        target_topics:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            format: uuid
        deadline:
          type: string
          format: date
          description: Calendar date in the learner's time zone.
        active:
          type: boolean
          default: false
        weekly_minutes:
          $ref: '#/components/schemas/WeeklyMinutes'
          description: Positive for active goals. Active allocations share the profile budget.
        languages:
          $ref: '#/components/schemas/PreferenceLabels'
        formats:
          $ref: '#/components/schemas/PreferenceLabels'
        self_assessments:
          type: array
          maxItems: 16
          items:
            type: object
            required: [topic_id, level]
            properties:
              topic_id:
                type: string
                format: uuid
              level:
                type: string
                enum: [unknown, beginner, intermediate, advanced]
    PreferenceLabels:
      type: array
      maxItems: 8
      uniqueItems: true
      items:
        type: string
        pattern: '^[a-z][a-z0-9_-]{0,31}$'
    Goal:
      allOf:
        - $ref: '#/components/schemas/GoalInput'
        - type: object
          required: [id, user_id, timezone, version, created_at, updated_at, skills, feasibility]
          properties:
            id:
              type: string
              format: uuid
            user_id:
              type: string
              format: uuid
            timezone:
              type: string
            version:
              type: integer
              format: int64
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            skills:
              type: array
              items:
                type: object
                required: [topic_id, state]
                properties:
                  topic_id:
                    type: string
                    format: uuid
                  state:
                    type: string
                    const: unknown
            feasibility:
              type: string
              enum: [not_evaluated, infeasible]
            feasibility_reason:
              type: string
              const: deadline_passed
